# What Dependabot watches. There is deliberately no pip entry: the backend is
# stdlib-only, so pyproject.toml has nothing to update. See docs/development.md.
#
# The prefixes are release decisions, not decoration: a squash merge makes the
# PR title the commit subject that release-please reads, and pr.yml rejects a
# title that is not a conventional commit. `deps` is what ships to users and
# gets a line in the changelog; `build` and `ci` are hidden from it, so a
# week of tooling bumps says nothing about the product.
version: 2

updates:
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: saturday
      time: "06:00"
      timezone: Etc/UTC
    # A week's wait outlasts most compromised releases, which are usually
    # found and pulled within days. Security updates ignore this.
    cooldown:
      default-days: 7
    # web/ is an application, so move the declared version with the lockfile
    # rather than leaving package.json's floor to drift. Explicit because the
    # default guesses application or library from the package's metadata.
    versioning-strategy: increase
    commit-message:
      prefix: deps
      prefix-development: build
    ignore:
      # Follows the Node that CI builds on (node-version in pr.yml), not
      # whatever Node is newest. Move it by hand along with that.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    # A dependency lands in the first group that matches, so the major groups
    # come first; their update-types keep minors falling through to the rest.
    groups:
      # Peers that cannot change major one at a time: alone, each PR fails
      # npm's peer check and neither can ever go green.
      react-major:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
        update-types: [major]
      # A new Vite major can raise the Node floor: check build.sh's version
      # test against it when this one arrives.
      vite-major:
        patterns: ["vite", "@vitejs/plugin-react"]
        update-types: [major]
      # Split by type because the title's prefix is: one PR mixing the two
      # would be titled `deps` and report tooling bumps as product changes.
      runtime:
        dependency-type: production
        update-types: [minor, patch]
      # TypeScript stays out and gets its own PR: its minors are allowed to
      # break code, and one failing typecheck would hold up every other tool.
      tooling:
        dependency-type: development
        exclude-patterns: ["typescript"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: saturday
      time: "06:00"
      timezone: Etc/UTC
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]
