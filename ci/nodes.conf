# The VMs each set brings up, one per line. `ci` is what cluster.yml uses;
# `dev` is ci/dev-cluster.sh's long-lived cluster for trying things by hand.
# The two never run at once (16 GB of RAM fits one set), and every script
# refuses to delete a VMID whose name is not the one listed here.
#
# The first node of a set is where the cluster is started.
#
# set vmid name        os      octet flavor cores mem(MB) balloon(MB) disk(GB)
ci    201  ci-ubuntu   ubuntu  21    lxd    3     2560    1536        40
ci    202  ci-debian   debian  22    incus  3     2560    1536        40
ci    203  ci-fedora   fedora  23    incus  3     2560    1536        40
ci    204  ci-alma     alma    24    lxd    3     2560    1536        40
dev   211  dev-ubuntu  ubuntu  31    lxd    3     2560    1536        40
dev   212  dev-debian  debian  32    incus  3     2560    1536        40
dev   213  dev-fedora  fedora  33    incus  3     2560    1536        40
dev   214  dev-alma    alma    34    lxd    3     2560    1536        40
