# One golden template per OS, built by build-templates.sh. A URL ending in
# `/` is a directory listing: the newest file matching the pattern is used,
# for releases whose image names carry a build number (Fedora). Everything
# else is a fixed URL. Pin a release by naming it, never "latest" of the
# distribution: an OS bump should be a commit here, not a surprise.
#
# os      octet  url                                                                                   pattern
ubuntu    91     https://cloud-images.ubuntu.com/resolute/current/resolute-server-cloudimg-amd64.img  -
debian    92     https://cloud.debian.org/images/cloud/trixie/latest/debian-13-generic-amd64.qcow2 -
fedora    93     https://download.fedoraproject.org/pub/fedora/linux/releases/45/Cloud/x86_64/images/  Fedora-Cloud-Base-Generic-45-[0-9.]*x86_64.qcow2
alma      94     https://repo.almalinux.org/almalinux/10/cloud/x86_64/images/AlmaLinux-10-GenericCloud-latest.x86_64.qcow2 -
