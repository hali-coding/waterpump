[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "waterpump"
version = "0.11.1"
description = "Instances and scheduled tasks on LXD and Incus, across a cluster of mixed hosts"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []          # stdlib only, by design

[project.scripts]
waterpump = "waterpump.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
